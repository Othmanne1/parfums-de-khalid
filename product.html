<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Parfum - Détails</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{margin:0;font-family:Montserrat,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:#fbf9f7;color:#222}
    .container{max-width:980px;margin:0 auto;padding:1rem}
    .back-link{display:inline-block;margin-bottom:1rem;color:#8b5e3c;text-decoration:none;font-weight:600}
    .product-detail{display:grid;grid-template-columns:1.2fr .8fr;gap:2rem;align-items:start}
    .product-image{border-radius:20px;overflow:hidden;box-shadow:0 18px 40px rgba(15,15,15,.08)}
    .product-image img{width:100%;display:block}
    .product-info{background:#fff;padding:1.5rem;border-radius:20px;box-shadow:0 16px 40px rgba(0,0,0,.06)}
    .product-info h1{margin-top:0;color:#8b5e3c;font-size:2rem}
    .product-info p{line-height:1.7;color:#555}
    .price-tag{margin:1rem 0;font-size:1.5rem;font-weight:700;color:#8b5e3c}
    .btn-group{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1.5rem}
    .btn{padding:.9rem 1.2rem;border-radius:14px;border:none;cursor:pointer;font-weight:700}
    .btn.primary{background:#8b5e3c;color:#fff}
    .btn.secondary{background:#fff;color:#8b5e3c;border:2px solid #8b5e3c}
    .info-box{background:#fff9f5;border:1px solid #f0d6c2;padding:1rem;border-radius:14px;color:#6d4a34;margin-top:1.5rem}
    .error{padding:2rem;background:#ffe3d1;border:1px solid #f2b59a;border-radius:16px;color:#8f3b10}
    @media (max-width:860px){.product-detail{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="index.html">← Retour à la collection</a>
    <div id="content"></div>
  </div>
  <script>
    const DEFAULT_CONFIG = {
      hero: {
        title: 'Les meilleurs parfums, livraison rapide',
        subtitle: 'Choisissez, ajoutez au panier et commandez via WhatsApp.',
        caption: 'Authentic fragrances · Qualité garantie',
        image: 'https://source.unsplash.com/1200x800/?perfume,bottle',
      },
      whatsappNumber: '212712233293',
      products: [
        {id:1,name:'Bleu de Chanel (Eau de Parfum)',price:300,image:'https://source.unsplash.com/800x800/?perfume,bottle&sig=1'},
        {id:2,name:'Acqua Di Giò - Giorgio Armani (Pour Homme)',price:300,image:'https://source.unsplash.com/800x800/?perfume,bottle&sig=2'},
        {id:3,name:'Y - Yves Saint Laurent (Eau de Parfum)',price:300,image:'https://source.unsplash.com/800x800/?perfume,bottle&sig=3'},
        {id:4,name:'Light Blue - Dolce & Gabbana (Pour Homme)',price:300,image:'https://source.unsplash.com/800x800/?perfume,bottle&sig=4'},
        {id:5,name:'Aventus - Creed',price:300,image:'https://source.unsplash.com/800x800/?perfume,bottle&sig=5'},
        {id:6,name:'Acqua Di Giò Profondo - Giorgio Armani',price:300,image:'https://source.unsplash.com/800x800/?perfume,bottle&sig=6'},
        {id:7,name:'Arabians - Montale Paris',price:300,image:'https://source.unsplash.com/800x800/?perfume,bottle&sig=7'},
        {id:8,name:'Y - Yves Saint Laurent (Eau de Toilette / Le Parfum)',price:300,image:'https://source.unsplash.com/800x800/?perfume,bottle&sig=8'},
        {id:9,name:'Stronger With You - Emporio Armani',price:300,image:'https://source.unsplash.com/800x800/?perfume,bottle&sig=9'},
        {id:10,name:'Coffret "Le Beau" - Jean Paul Gaultier (3x40ml)',price:300,image:'https://source.unsplash.com/800x800/?perfume,gift,box&sig=10'},
        {id:11,name:'Scandal Pour Homme - Jean Paul Gaultier',price:300,image:'https://source.unsplash.com/800x800/?perfume,bottle&sig=11'},
        {id:12,name:'Le Beau Le Parfum - Jean Paul Gaultier',price:300,image:'https://source.unsplash.com/800x800/?perfume,bottle&sig=12'},
      ]
    }

    function loadSiteConfig(){
      const saved = JSON.parse(localStorage.getItem('siteConfig') || 'null');
      return saved ? {...DEFAULT_CONFIG,...saved, hero:{...DEFAULT_CONFIG.hero,...saved.hero}, products:saved.products||DEFAULT_CONFIG.products} : DEFAULT_CONFIG;
    }

    function getQueryParam(name){
      return new URLSearchParams(window.location.search).get(name)
    }

    function createDescription(product){
      return product.description || `Un parfum raffiné parfait pour toutes les occasions, utilisant des notes intenses et durables pour une signature olfactive unique.`
    }

    function addToCart(productId){
      const cart = JSON.parse(localStorage.getItem('cart') || '{}')
      cart[productId] = (cart[productId] || 0) + 1
      localStorage.setItem('cart', JSON.stringify(cart))
      alert('Produit ajouté au panier !')
    }

    const config = loadSiteConfig()
    const id = Number(getQueryParam('id'))
    const product = config.products.find(p => p.id === id)
    const content = document.getElementById('content')

    if(!product){
      content.innerHTML = `<div class="error">Produit introuvable. Retournez à la collection et choisissez un parfum.</div>`
    } else {
      content.innerHTML = `
        <div class="product-detail">
          <div class="product-image"><img src="${product.image}" alt="${product.name}"></div>
          <div class="product-info">
            <h1>${product.name}</h1>
            <div class="price-tag">${product.price} DH</div>
            <p>${createDescription(product)}</p>
            <div class="info-box">
              <strong>Disponible maintenant</strong><br>
              Commandez facilement via WhatsApp après avoir ajouté au panier.
            </div>
            <div class="btn-group">
              <button class="btn primary" id="addToCartBtn">Ajouter au panier</button>
              <a class="btn secondary" href="index.html">Retour à la collection</a>
            </div>
          </div>
        </div>
      `
      document.getElementById('addToCartBtn').addEventListener('click', () => addToCart(product.id))
    }
  </script>
</body>
</html>
